trigger:
- main

pr:
- main

pool:
  vmImage: windows-latest

variables:
  buildConfiguration: Release

stages:
- stage: Build_And_Test
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      inputs:
        version: 10.x

    - script: dotnet tool install dotnet-sonarscanner --tool-path $(Agent.TempDirectory)/sonar
      displayName: Install SonarScanner

    - script: $(Agent.TempDirectory)/sonar/dotnet-sonarscanner begin /k:"ifruit_iBlendit" /o:"ifruit" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="%SONAR_TOKEN%" /d:sonar.coverage.exclusions="**/Front-End/**,**/Program.cs,**/Properties/**" /d:sonar.cs.opencover.reportsPaths="$(Agent.TempDirectory)/**/coverage.opencover.xml"
      displayName: Prepare SonarCloud
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)

    - script: dotnet build SmoothieTruckApp/SmoothieTruckApp.slnx -c $(buildConfiguration)
      displayName: Build

    - task: DotNetCoreCLI@2
      displayName: Test
      inputs:
        command: test
        projects: SmoothieTruckApp.Tests/SmoothieTruckApp.Tests.csproj
        arguments: -c $(buildConfiguration) --collect "XPlat Code Coverage" --settings SmoothieTruckApp.Tests/coverage.runsettings

    - task: PublishCodeCoverageResults@2
      displayName: Publish Coverage
      inputs:
        summaryFileLocation: $(Agent.TempDirectory)/**/coverage.cobertura.xml

    - script: $(Agent.TempDirectory)/sonar/dotnet-sonarscanner end /d:sonar.token="%SONAR_TOKEN%"
      displayName: Run SonarCloud Analysis
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)

    - script: dotnet publish SmoothieTruckApp/SmoothieTruckApp.csproj -c $(buildConfiguration) -r win-x64 --self-contained true -o $(Build.ArtifactStagingDirectory)/app/bin/Release/net10.0-windows
      displayName: Publish App

    - task: CopyFiles@2
      displayName: Copy Database
      inputs:
        SourceFolder: SmoothieTruckApp/DataBase/DB_Tables
        TargetFolder: $(Build.ArtifactStagingDirectory)/app/DataBase/DB_Tables

    - task: ArchiveFiles@2
      displayName: Zip App
      inputs:
        rootFolderOrFile: $(Build.ArtifactStagingDirectory)/app
        includeRootFolder: false
        archiveFile: $(Build.ArtifactStagingDirectory)/iBlendit.zip

    - task: PublishPipelineArtifact@1
      displayName: Upload Artifact
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/iBlendit.zip
        artifact: iBlendit

- stage: Deploy
  dependsOn: Build_And_Test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: Deploy
    steps:
    - download: current
      artifact: iBlendit

    - task: UniversalPackages@0
      displayName: Publish To Azure Artifacts
      inputs:
        command: publish
        publishDirectory: $(Pipeline.Workspace)/iBlendit
        vstsFeedPublish: iFruitStudio/iblendit-releases
        vstsFeedPackagePublish: iblendit
        versionOption: custom
        versionPublish: 1.0.$(Build.BuildId)
        packagePublishDescription: iBlendit release from build $(Build.BuildNumber)

    - task: GitHubRelease@1
      displayName: Publish GitHub Release
      inputs:
        gitHubConnection: JanArnoCoetzer
        repositoryName: JanArnoCoetzer/Softwar_Tools_Y3_iFruitVersionControl
        action: create
        target: $(Build.SourceVersion)
        tagSource: userSpecifiedTag
        tag: v1.0.$(Build.BuildId)
        title: iBlendit 1.0.$(Build.BuildId)
        assets: $(Pipeline.Workspace)/iBlendit/iBlendit.zip
        addChangeLog: true

- stage: Docker
  dependsOn: Build_And_Test
  jobs:
  - job: Build_And_Push
    pool:
      vmImage: windows-2022
    steps:
    - download: current
      artifact: iBlendit

    - task: ExtractFiles@1
      displayName: Unzip App
      inputs:
        archiveFilePatterns: $(Pipeline.Workspace)/iBlendit/iBlendit.zip
        destinationFolder: $(Pipeline.Workspace)/app

    - task: Docker@2
      displayName: Build And Push Image
      inputs:
        containerRegistry: dockerhub
        repository: rlock111/iblendit
        command: buildAndPush
        Dockerfile: $(Build.SourcesDirectory)/Dockerfile
        buildContext: $(Pipeline.Workspace)/app
        tags: |
          1.0.$(Build.BuildId)
          latest

    - powershell: |
        New-Item -ItemType Directory -Force $(Build.ArtifactStagingDirectory)/docker | Out-Null
        "Image: rlock111/iblendit:1.0.$(Build.BuildId)`nAlso tagged: latest`nDocker Hub: https://hub.docker.com/r/rlock111/iblendit`nPull: docker pull rlock111/iblendit:1.0.$(Build.BuildId)`nRun: docker run --rm rlock111/iblendit:1.0.$(Build.BuildId)" | Out-File $(Build.ArtifactStagingDirectory)/docker/docker-image.txt -Encoding utf8
      displayName: Write Image Info

    - task: PublishPipelineArtifact@1
      displayName: Upload Image Info
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/docker
        artifact: docker-image

- stage: Container_Deploy
  dependsOn: Docker
  jobs:
  - job: Pull_And_Run
    pool:
      vmImage: windows-2022
    steps:
    - checkout: none

    - task: Docker@2
      displayName: Docker Hub Login
      inputs:
        containerRegistry: dockerhub
        command: login

    - script: docker pull rlock111/iblendit:1.0.$(Build.BuildId)
      displayName: Pull Image

    - script: docker run --rm rlock111/iblendit:1.0.$(Build.BuildId)
      displayName: Run Smoke Test
